<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <link id="appleIcon" rel="apple-touch-icon" href="" />
  <title>Mis Gastos</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131926;
      --surface-elevated: #1c2436;
      --border: #252f44;
      --text: #f8fafc;
      --text-muted: #94a3b8;

      /* Gastos Fijos: Índigo */
      --fixed: #6366f1;
      --fixed-soft: rgba(99, 102, 241, 0.14);
      --fixed-border: rgba(99, 102, 241, 0.38);

      /* Gastos Puntuales: Ámbar */
      --var: #f59e0b;
      --var-soft: rgba(245, 158, 11, 0.14);
      --var-border: rgba(245, 158, 11, 0.38);

      /* Estados */
      --paid: #22c55e;
      --paid-soft: rgba(34, 197, 94, 0.14);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: max(36px, env(safe-area-inset-bottom));
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      min-height: 100dvh;
    }

    .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Cabecera */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="month"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 15px;
      font-weight: 600;
      height: 40px;
      outline: none;
    }

    .btn-refresh {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Total General */
    .hero-total {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px 18px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .hero-amount {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .sync-badge {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-elevated);
      color: var(--text-muted);
    }

    .sync-badge.syncing {
      color: var(--var);
    }

    /* Tarjetas Fijos vs Puntuales */
    .split-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .mini-card {
      border-radius: 16px;
      padding: 13px 14px;
      border: 1px solid var(--border);
    }

    .mini-card.fixed {
      background: var(--fixed-soft);
      border-color: var(--fixed-border);
    }

    .mini-card.variable {
      background: var(--var-soft);
      border-color: var(--var-border);
    }

    .mini-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-card.fixed .mini-title { color: #a5b4fc; }
    .mini-card.variable .mini-title { color: #fcd34d; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot.fixed { background: var(--fixed); }
    .dot.variable { background: var(--var); }

    .mini-amount {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .mini-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Barra de Presupuesto Puntuales */
    .budget-bar-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 14px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .budget-bar-card:active {
      background: var(--surface-elevated);
    }

    .budget-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      margin-bottom: 7px;
    }

    .budget-label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .budget-numbers {
      font-weight: 700;
      color: var(--text);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background: var(--surface-elevated);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--var);
      border-radius: 999px;
      transition: width 0.25s ease, background-color 0.25s ease;
    }

    /* Selector de Vista */
    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      gap: 4px;
    }

    .seg-btn {
      height: 42px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .seg-btn.active-fixed {
      background: var(--fixed);
      color: #fff;
    }

    .seg-btn.active-variable {
      background: var(--var);
      color: #0b0f19;
      font-weight: 700;
    }

    /* Formularios */
    .form-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }

    .form-card.fixed-theme { border-top: 3px solid var(--fixed); }
    .form-card.variable-theme { border-top: 3px solid var(--var); }

    .section-heading {
      font-size: 0.96rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field-group { margin-bottom: 12px; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .input {
      width: 100%;
      height: 46px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .input:focus { border-color: var(--text); }

    /* Selector unificado de categoría puntual */
    .tag-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 14px;
    }

    .tag-btn {
      flex: 1 1 auto;
      min-width: 64px;
      height: 38px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tag-btn.selected {
      background: var(--var-soft);
      border-color: var(--var);
      color: #fcd34d;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 13px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit:active { opacity: 0.85; }
    .btn-fixed { background: var(--fixed); color: #fff; }
    .btn-variable { background: var(--var); color: #0b0f19; }

    /* Cabecera de lista + filtros idénticos */
    .list-top {
      margin-bottom: 10px;
    }

    .list-header {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filter-pills::-webkit-scrollbar { display: none; }

    .f-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .f-pill.active {
      background: var(--var-soft);
      border-color: var(--var);
      color: #fcd34d;
    }

    /* Filas de gastos */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .expense-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .expense-row:active {
      background: var(--surface-elevated);
    }

    .expense-row.fixed-row { border-left: 4px solid var(--fixed); }
    .expense-row.variable-row { border-left: 4px solid var(--var); }

    .row-main {
      min-width: 0;
      flex: 1;
    }

    .row-title {
      font-size: 0.96rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .row-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .pill-fixed { background: var(--fixed-soft); color: #a5b4fc; }
    .pill-var { background: var(--var-soft); color: #fcd34d; }

    .row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .row-amount {
      font-size: 1.02rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-btn {
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: 0.76rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-muted);
      cursor: pointer;
    }

    .status-btn.is-paid {
      background: var(--paid-soft);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--paid);
    }

    .empty-msg {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 0.86rem;
      background: var(--surface);
      border-radius: 15px;
      border: 1px dashed var(--border);
    }

    .hidden { display: none !important; }

    /* Bottom Sheet Modal estilo iOS */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .sheet-card {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      padding: 18px 18px max(26px, env(safe-area-inset-bottom));
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      margin: 0 auto 14px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .sheet-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .sheet-close {
      background: var(--surface-elevated);
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .sheet-actions {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-delete-sheet {
      height: 48px;
      border-radius: 13px;
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .budget-stepper {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    .step-btn {
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .step-btn:active {
      background: var(--var-soft);
      border-color: var(--var);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
      z-index: 120;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<main class="app">
  <!-- Cabecera -->
  <header class="top-bar">
    <h1 class="app-title">Gastos</h1>
    <div class="month-control">
      <input type="month" id="monthPicker" aria-label="Seleccionar mes" />
      <button class="btn-refresh" id="btnRefresh" title="Sincronizar">&#x21bb;</button>
    </div>
  </header>

  <!-- Total General -->
  <section class="hero-total">
    <div>
      <div class="hero-label">Total del mes</div>
      <div class="hero-amount" id="totalMes">0,00 €</div>
    </div>
    <div class="sync-badge" id="syncStatus">Al día</div>
  </section>

  <!-- Tarjetas Fijos vs Puntuales -->
  <section class="split-cards">
    <div class="mini-card fixed">
      <div class="mini-title"><span class="dot fixed"></span> Fijos</div>
      <div class="mini-amount" id="totalFijos">0,00 €</div>
      <div class="mini-sub" id="subFijos">Pagado: 0,00 €</div>
    </div>
    <div class="mini-card variable">
      <div class="mini-title"><span class="dot variable"></span> Puntuales</div>
      <div class="mini-amount" id="totalPuntuales">0,00 €</div>
      <div class="mini-sub" id="subPuntuales">0 apuntes</div>
    </div>
  </section>

  <!-- Barra de Presupuesto Puntuales -->
  <section class="budget-bar-card" id="budgetCard">
    <div class="budget-top">
      <span class="budget-label">Presupuesto puntuales</span>
      <span class="budget-numbers" id="budgetText">0 € / 400 €</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="budgetFill"></div>
    </div>
  </section>

  <!-- Selector de Sección -->
  <nav class="segmented">
    <button type="button" class="seg-btn active-variable" id="tabPuntuales">Gastos Puntuales</button>
    <button type="button" class="seg-btn" id="tabFijos">Gastos Fijos</button>
  </nav>

  <!-- VISTA 1: GASTOS PUNTUALES (ÁMBAR) -->
  <section id="viewPuntuales">
    <form id="formPuntual" class="form-card variable-theme">
      <div class="section-heading">
        <span class="dot variable"></span> Añadir gasto puntual
      </div>

      <div class="field-group">
        <label class="field-label" for="punConcepto">Concepto</label>
        <input class="input" type="text" id="punConcepto" placeholder="Ej. Compra semanal, Cena, Bombillas..." required />
      </div>

      <div class="field-row">
        <div>
          <label class="field-label" for="punImporte">Importe (€)</label>
          <input class="input" type="number" inputmode="decimal" step="0.01" min="0.01" id="punImporte" placeholder="0,00" required />
        </div>
        <div>
          <label class="field-label" for="punFecha">Fecha</label>
          <input class="input" type="date" id="punFecha" required />
        </div>
      </div>

      <label class="field-label">Categoría</label>
      <div class="tag-selector" id="punTags"></div>

      <button type="submit" class="btn-submit btn-variable">Guardar gasto puntual</button>
    </form>

    <div class="list-top">
      <div class="list-header">Historial</div>
      <div class="filter-pills" id="filterPills"></div>
    </div>
    <div id="listPuntuales" class="item-list"></div>
  </section>

  <!-- VISTA 2: GASTOS FIJOS (ÍNDIGO) -->
  <section id="viewFijos" class="hidden">
    <form id="formFijo" class="form-card fixed-theme">
      <div class="section-heading">
        <span class="dot fixed"></span> Añadir gasto fijo mensual
      </div>

      <div class="field-group">
        <label class="field-label" for="fixConcepto">Concepto del recibo</label>
        <input class="input" type="text" id="fixConcepto" placeholder="Ej. Alquiler piso, Factura luz..." required />
      </div>

      <div class="field-row">
        <div>
          <label class="field-label" for="fixImporte">Importe habitual (€)</label>
          <input class="input" type="number" inputmode="decimal" step="0.01" min="0.01" id="fixImporte" placeholder="0,00" required />
        </div>
        <div>
          <label class="field-label" for="fixCategoria">Categoría</label>
          <select class="input" id="fixCategoria">
            <option value="Alquiler">Alquiler</option>
            <option value="Luz">Luz</option>
            <option value="Internet">Internet</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-submit btn-fixed">Guardar gasto fijo</button>
    </form>

    <div class="list-top">
      <div class="list-header">Recibos del mes (tocar para editar)</div>
    </div>
    <div id="listFijos" class="item-list"></div>
  </section>
</main>

<!-- Bottom Sheet: Ajustar Presupuesto Mensual -->
<div id="budgetModal" class="sheet-backdrop hidden">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Presupuesto mensual puntuales</span>
      <button type="button" class="sheet-close" id="closeBudgetModal">✕</button>
    </div>
    <div class="field-group">
      <label class="field-label" for="budgetInput">Tope orientativo (€)</label>
      <div class="budget-stepper">
        <button type="button" class="step-btn" id="budgetMinus">-50 €</button>
        <input class="input" type="number" inputmode="decimal" step="10" min="10" id="budgetInput" style="text-align:center; font-weight:700;" />
        <button type="button" class="step-btn" id="budgetPlus">+50 €</button>
      </div>
    </div>
    <button type="button" class="btn-submit btn-variable" id="btnSaveBudget">Guardar presupuesto</button>
  </div>
</div>

<!-- Bottom Sheet: Editar Gasto Puntual -->
<div id="editPuntualModal" class="sheet-backdrop hidden">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Editar gasto puntual</span>
      <button type="button" class="sheet-close" id="closeEditPun">✕</button>
    </div>
    <input type="hidden" id="editPunId" />
    <div class="field-group">
      <label class="field-label">Concepto</label>
      <input class="input" type="text" id="editPunConcepto" />
    </div>
    <div class="field-row">
      <div>
        <label class="field-label">Importe (€)</label>
        <input class="input" type="number" inputmode="decimal" step="0.01" id="editPunImporte" />
      </div>
      <div>
        <label class="field-label">Fecha</label>
        <input class="input" type="date" id="editPunFecha" />
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Categoría</label>
      <select class="input" id="editPunCategoria"></select>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn-delete-sheet" id="btnDelPunModal">Borrar</button>
      <button type="button" class="btn-submit btn-variable" id="btnSavePunModal">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Bottom Sheet: Editar Gasto Fijo -->
<div id="editFijoModal" class="sheet-backdrop hidden">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Editar recibo fijo</span>
      <button type="button" class="sheet-close" id="closeEditFix">✕</button>
    </div>
    <input type="hidden" id="editFixId" />
    <div class="field-group">
      <label class="field-label">Concepto</label>
      <input class="input" type="text" id="editFixConcepto" />
    </div>
    <div class="field-row">
      <div>
        <label class="field-label">Importe este mes (€)</label>
        <input class="input" type="number" inputmode="decimal" step="0.01" id="editFixImporte" />
      </div>
      <div>
        <label class="field-label">Categoría</label>
        <select class="input" id="editFixCategoria">
          <option value="Alquiler">Alquiler</option>
          <option value="Luz">Luz</option>
          <option value="Internet">Internet</option>
        </select>
      </div>
    </div>
    <label class="checkbox-row">
      <input type="checkbox" id="editFixUpdateBase" />
      <span>Actualizar también como importe fijo para futuros meses (desmarca si es factura variable como la Luz)</span>
    </label>
    <div class="sheet-actions">
      <button type="button" class="btn-delete-sheet" id="btnDelFixModal">Borrar</button>
      <button type="button" class="btn-submit btn-fixed" id="btnSaveFixModal">Guardar cambios</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzRkndI7vLONGGWdUHKdirdNr48v0eYiFcp6YbHYyZ_pKhpzTLmYtwMgRPH3cDDWdAwSA/exec';

  // Única fuente de verdad para formulario, filtros e historial
  const CATEGORIAS_PUNTUALES = ['Súper', 'Ocio', 'Casa', 'Salud', 'Varios'];

  let state = { fijos: [], puntuales: [] };
  let selectedTag = CATEGORIAS_PUNTUALES[0];
  let activeFilter = 'Todos';
  let monthlyBudget = Number(localStorage.getItem('gastos_budget')) || 400;

  const $ = (id) => document.getElementById(id);

  document.addEventListener('DOMContentLoaded', () => {
    generateAppIcon();
    renderCategoryControls();

    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');

    $('monthPicker').value = `${yyyy}-${mm}`;
    $('punFecha').value = `${yyyy}-${mm}-${dd}`;

    bindEvents();
    handleUrlShortcuts();
    loadData();
  });

  // Rellena con exactamente las mismas categorías el formulario, el filtro y el modal de edición
  function renderCategoryControls() {
    $('punTags').innerHTML = CATEGORIAS_PUNTUALES.map((cat, idx) =>
      `<button type="button" class="tag-btn ${idx === 0 ? 'selected' : ''}" data-tag="${cat}">${cat}</button>`
    ).join('');

    $('filterPills').innerHTML = ['Todos', ...CATEGORIAS_PUNTUALES].map((cat, idx) =>
      `<button type="button" class="f-pill ${idx === 0 ? 'active' : ''}" data-filter="${cat}">${cat}</button>`
    ).join('');

    $('editPunCategoria').innerHTML = CATEGORIAS_PUNTUALES.map(cat =>
      `<option value="${cat}">${cat}</option>`
    ).join('');
  }

  function generateAppIcon() {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0b0f19';
      ctx.fillRect(0, 0, 180, 180);

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(90, 90, 62, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0b0f19';
      ctx.font = 'bold 76px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('€', 90, 95);

      $('appleIcon').href = canvas.toDataURL('image/png');
    } catch (e) {}
  }

  function handleUrlShortcuts() {
    const params = new URLSearchParams(window.location.search);
    const concepto = params.get('concepto');
    const importe = params.get('importe');
    const fecha = params.get('fecha');
    const categoria = params.get('categoria');

    if (concepto || importe) {
      if (concepto) $('punConcepto').value = concepto;
      if (importe) $('punImporte').value = parseFloat(importe.replace(',', '.')) || '';
      if (fecha) $('punFecha').value = fecha;
      if (categoria && CATEGORIAS_PUNTUALES.includes(categoria)) {
        selectedTag = categoria;
        document.querySelectorAll('#punTags .tag-btn').forEach(b => {
          b.classList.toggle('selected', b.dataset.tag === categoria);
        });
      }
      window.history.replaceState({}, document.title, window.location.pathname);
      setTimeout(() => {
        if (!importe) $('punImporte').focus();
      }, 200);
    }
  }

  function bindEvents() {
    // Pestañas
    $('tabPuntuales').addEventListener('click', () => {
      $('tabPuntuales').className = 'seg-btn active-variable';
      $('tabFijos').className = 'seg-btn';
      $('viewPuntuales').classList.remove('hidden');
      $('viewFijos').classList.add('hidden');
    });

    $('tabFijos').addEventListener('click', () => {
      $('tabFijos').className = 'seg-btn active-fixed';
      $('tabPuntuales').className = 'seg-btn';
      $('viewFijos').classList.remove('hidden');
      $('viewPuntuales').classList.add('hidden');
    });

    $('monthPicker').addEventListener('change', loadData);
    $('btnRefresh').addEventListener('click', loadData);

    // Cerrar modales al tocar fuera de la tarjeta
    document.querySelectorAll('.sheet-backdrop').forEach(backdrop => {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) backdrop.classList.add('hidden');
      });
    });

    // Bottom Sheet Presupuesto Mensual
    $('budgetCard').addEventListener('click', () => {
      $('budgetInput').value = monthlyBudget;
      $('budgetModal').classList.remove('hidden');
    });
    $('closeBudgetModal').addEventListener('click', () => $('budgetModal').classList.add('hidden'));
    $('budgetMinus').addEventListener('click', () => {
      const curr = parseFloat($('budgetInput').value) || monthlyBudget;
      $('budgetInput').value = Math.max(10, curr - 50);
    });
    $('budgetPlus').addEventListener('click', () => {
      const curr = parseFloat($('budgetInput').value) || monthlyBudget;
      $('budgetInput').value = curr + 50;
    });
    $('btnSaveBudget').addEventListener('click', () => {
      const val = parseFloat(String($('budgetInput').value).replace(',', '.'));
      if (!isNaN(val) && val > 0) {
        monthlyBudget = val;
        localStorage.setItem('gastos_budget', String(val));
        renderAll();
        $('budgetModal').classList.add('hidden');
        showToast('Presupuesto actualizado');
      }
    });

    // Selección de categoría en formulario puntual
    document.querySelectorAll('#punTags .tag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#punTags .tag-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedTag = btn.dataset.tag;
      });
    });

    // Filtros de historial puntual
    document.querySelectorAll('#filterPills .f-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('#filterPills .f-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        activeFilter = pill.dataset.filter;
        renderPuntuales();
      });
    });

    // Guardar Gasto Puntual (Optimistic UI)
    $('formPuntual').addEventListener('submit', (e) => {
      e.preventDefault();
      const concepto = $('punConcepto').value.trim();
      const importe = parseFloat($('punImporte').value);
      const fecha = $('punFecha').value;
      if (!concepto || isNaN(importe) || !fecha) return;

      const id = 'GAS-' + Date.now();
      const mes = fecha.substring(0, 7);

      if (mes === $('monthPicker').value) {
        state.puntuales.unshift({ id, fecha, concepto, categoria: selectedTag, importe });
        state.puntuales.sort((a, b) => b.fecha.localeCompare(a.fecha));
        renderAll();
      }

      $('punConcepto').value = '';
      $('punImporte').value = '';
      showToast('Gasto guardado');

      syncBackground({
        action: 'addManualExpense',
        id,
        concepto,
        importe,
        fecha,
        categoria: selectedTag
      });
    });

    // Guardar Gasto Fijo (Optimistic UI)
    $('formFijo').addEventListener('submit', (e) => {
      e.preventDefault();
      const concepto = $('fixConcepto').value.trim();
      const importe = parseFloat($('fixImporte').value);
      const categoria = $('fixCategoria').value;
      if (!concepto || isNaN(importe)) return;

      const id = 'FIX-' + Date.now();
      state.fijos.push({ id, concepto, categoria, importeBase: importe, importe, pagado: false });
      renderAll();

      $('fixConcepto').value = '';
      $('fixImporte').value = '';
      showToast('Gasto fijo añadido');

      syncBackground({ action: 'addFixed', id, concepto, importe, categoria });
    });

    // Modal Editar Puntual
    $('closeEditPun').addEventListener('click', () => $('editPuntualModal').classList.add('hidden'));
    $('btnSavePunModal').addEventListener('click', () => {
      const id = $('editPunId').value;
      const concepto = $('editPunConcepto').value.trim();
      const importe = parseFloat($('editPunImporte').value);
      const fecha = $('editPunFecha').value;
      const categoria = $('editPunCategoria').value;
      if (!concepto || isNaN(importe) || !fecha) return;

      const idx = state.puntuales.findIndex(x => x.id === id);
      if (idx !== -1) {
        if (fecha.substring(0, 7) !== $('monthPicker').value) {
          state.puntuales.splice(idx, 1);
        } else {
          state.puntuales[idx] = { id, concepto, importe, fecha, categoria };
          state.puntuales.sort((a, b) => b.fecha.localeCompare(a.fecha));
        }
        renderAll();
      }

      $('editPuntualModal').classList.add('hidden');
      showToast('Cambios guardados');
      syncBackground({ action: 'editExpense', id, concepto, importe, fecha, categoria });
    });

    $('btnDelPunModal').addEventListener('click', () => {
      const id = $('editPunId').value;
      state.puntuales = state.puntuales.filter(x => x.id !== id);
      renderAll();
      $('editPuntualModal').classList.add('hidden');
      showToast('Gasto eliminado');
      syncBackground({ action: 'deleteExpense', id });
    });

    // Modal Editar Fijo
    $('closeEditFix').addEventListener('click', () => $('editFijoModal').classList.add('hidden'));
    $('btnSaveFixModal').addEventListener('click', () => {
      const id = $('editFixId').value;
      const concepto = $('editFixConcepto').value.trim();
      const importe = parseFloat($('editFixImporte').value);
      const categoria = $('editFixCategoria').value;
      const actualizarBase = $('editFixUpdateBase').checked;
      if (!concepto || isNaN(importe)) return;

      const item = state.fijos.find(x => x.id === id);
      if (item) {
        item.concepto = concepto;
        item.categoria = categoria;
        item.importe = importe;
        if (actualizarBase) item.importeBase = importe;
        renderAll();
      }

      $('editFijoModal').classList.add('hidden');
      showToast('Recibo actualizado');
      syncBackground({
        action: 'editFixed',
        id,
        concepto,
        categoria,
        importe,
        actualizarBase,
        month: $('monthPicker').value
      });
    });

    $('btnDelFixModal').addEventListener('click', () => {
      const id = $('editFixId').value;
      state.fijos = state.fijos.filter(x => x.id !== id);
      renderAll();
      $('editFijoModal').classList.add('hidden');
      showToast('Recibo eliminado');
      syncBackground({ action: 'deleteFixed', id });
    });
  }

  async function loadData() {
    setSync('Cargando...', true);
    try {
      const month = $('monthPicker').value;
      const res = await fetch(`${API_URL}?month=${encodeURIComponent(month)}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Error de lectura');
      state = data;
      renderAll();
      setSync('Al día', false);
    } catch (err) {
      setSync('Sin conexión', false);
      showToast('No se pudieron cargar los datos');
    }
  }

  async function syncBackground(payload) {
    setSync('Guardando...', true);
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Error en servidor');
      setSync('Al día', false);
    } catch (err) {
      setSync('Error sync', false);
      showToast('Error al sincronizar. Recargando...');
      loadData();
    }
  }

  function renderAll() {
    const totalFijos = state.fijos.reduce((acc, f) => acc + f.importe, 0);
    const pagadoFijos = state.fijos.reduce((acc, f) => acc + (f.pagado ? f.importe : 0), 0);
    const totalPuntuales = state.puntuales.reduce((acc, p) => acc + p.importe, 0);

    $('totalFijos').textContent = formatEuro(totalFijos);
    $('subFijos').textContent = `Pagado: ${formatEuro(pagadoFijos)}`;
    $('totalPuntuales').textContent = formatEuro(totalPuntuales);
    $('subPuntuales').textContent = `${state.puntuales.length} ${state.puntuales.length === 1 ? 'apunte' : 'apuntes'}`;
    $('totalMes').textContent = formatEuro(totalFijos + totalPuntuales);

    // Barra de presupuesto
    const pct = Math.min(100, Math.round((totalPuntuales / monthlyBudget) * 100));
    $('budgetText').textContent = `${Math.round(totalPuntuales)} € / ${monthlyBudget} €`;
    $('budgetFill').style.width = `${pct}%`;
    $('budgetFill').style.backgroundColor = pct >= 100 ? 'var(--danger)' : (pct >= 80 ? 'var(--var)' : 'var(--paid)');

    renderPuntuales();
    renderFijos();
  }

  function renderPuntuales() {
    const list = $('listPuntuales');
    const items = activeFilter === 'Todos'
      ? state.puntuales
      : state.puntuales.filter(p => p.categoria === activeFilter);

    if (items.length === 0) {
      list.innerHTML = '<div class="empty-msg">Sin gastos puntuales en esta vista.</div>';
      return;
    }

    list.innerHTML = '';
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'expense-row variable-row';
      el.innerHTML = `
        <div class="row-main">
          <div class="row-title">${escapeHtml(item.concepto)}</div>
          <div class="row-sub">
            <span class="pill pill-var">${escapeHtml(item.categoria)}</span>
            <span>${formatShortDate(item.fecha)}</span>
          </div>
        </div>
        <div class="row-right">
          <span class="row-amount">${formatEuro(item.importe)}</span>
        </div>
      `;
      el.addEventListener('click', () => openEditPuntual(item));
      list.appendChild(el);
    });
  }

  function renderFijos() {
    const list = $('listFijos');
    if (state.fijos.length === 0) {
      list.innerHTML = '<div class="empty-msg">Añade arriba tus gastos fijos (Alquiler, Luz, Internet).</div>';
      return;
    }

    list.innerHTML = '';
    state.fijos.forEach(item => {
      const el = document.createElement('div');
      el.className = 'expense-row fixed-row';
      el.innerHTML = `
        <div class="row-main">
          <div class="row-title">${escapeHtml(item.concepto)}</div>
          <div class="row-sub">
            <span class="pill pill-fixed">${escapeHtml(item.categoria)}</span>
          </div>
        </div>
        <div class="row-right">
          <span class="row-amount">${formatEuro(item.importe)}</span>
          <button type="button" class="status-btn ${item.pagado ? 'is-paid' : ''}">
            ${item.pagado ? 'Pagado' : 'Pendiente'}
          </button>
        </div>
      `;

      el.addEventListener('click', (e) => {
        if (e.target.closest('.status-btn')) return;
        openEditFijo(item);
      });

      el.querySelector('.status-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        item.pagado = !item.pagado;
        renderAll();
        syncBackground({
          action: 'toggleFixedPaid',
          id: item.id,
          pagado: item.pagado,
          importe: item.importe,
          month: $('monthPicker').value
        });
      });

      list.appendChild(el);
    });
  }

  function openEditPuntual(item) {
    $('editPunId').value = item.id;
    $('editPunConcepto').value = item.concepto;
    $('editPunImporte').value = item.importe;
    $('editPunFecha').value = item.fecha;
    $('editPunCategoria').value = CATEGORIAS_PUNTUALES.includes(item.categoria) ? item.categoria : 'Varios';
    $('editPuntualModal').classList.remove('hidden');
  }

  function openEditFijo(item) {
    $('editFixId').value = item.id;
    $('editFixConcepto').value = item.concepto;
    $('editFixImporte').value = item.importe;
    $('editFixCategoria').value = item.categoria;
    $('editFixUpdateBase').checked = item.categoria !== 'Luz';
    $('editFijoModal').classList.remove('hidden');
  }

  function formatEuro(num) {
    return Number(num || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  }

  function formatShortDate(iso) {
    const parts = String(iso).split('-');
    if (parts.length !== 3) return iso;
    return `${parts[2]}/${parts[1]}`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function setSync(text, syncing) {
    const el = $('syncStatus');
    el.textContent = text;
    el.classList.toggle('syncing', syncing);
  }

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.add('hidden'), 2400);
  }
</script>
</body>
</html>
