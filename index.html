<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <title>Mis Gastos</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131926;
      --surface-elevated: #1c2436;
      --border: #252f44;
      --text: #f8fafc;
      --text-muted: #94a3b8;

      /* Color Gastos Fijos: Índigo */
      --fixed: #6366f1;
      --fixed-soft: rgba(99, 102, 241, 0.14);
      --fixed-border: rgba(99, 102, 241, 0.38);

      /* Color Gastos Puntuales: Ámbar */
      --var: #f59e0b;
      --var-soft: rgba(245, 158, 11, 0.14);
      --var-border: rgba(245, 158, 11, 0.38);

      /* Estado Pagado / Peligro */
      --paid: #22c55e;
      --paid-soft: rgba(34, 197, 94, 0.14);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      min-height: 100dvh;
    }

    /* Optimizado para iPhone 15 Pro (393px) y centrado en pantallas mayores */
    .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Cabecera */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="month"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 15px;
      font-weight: 600;
      height: 40px;
      outline: none;
    }

    .btn-refresh {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Resumen Total + Desglose por Color */
    .hero-total {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .hero-amount {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .sync-dot {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .split-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .mini-card {
      border-radius: 16px;
      padding: 13px 14px;
      border: 1px solid var(--border);
    }

    .mini-card.fixed {
      background: var(--fixed-soft);
      border-color: var(--fixed-border);
    }

    .mini-card.variable {
      background: var(--var-soft);
      border-color: var(--var-border);
    }

    .mini-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-card.fixed .mini-title { color: #a5b4fc; }
    .mini-card.variable .mini-title { color: #fcd34d; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.fixed { background: var(--fixed); }
    .dot.variable { background: var(--var); }

    .mini-amount {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .mini-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Selector de Vista (Segmented Control estilo iOS) */
    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
      gap: 4px;
    }

    .seg-btn {
      height: 42px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .seg-btn.active-fixed {
      background: var(--fixed);
      color: #fff;
    }

    .seg-btn.active-variable {
      background: var(--var);
      color: #0b0f19;
      font-weight: 700;
    }

    /* Formulario Claro y Espaciado */
    .form-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }

    .form-card.fixed-theme {
      border-top: 3px solid var(--fixed);
    }

    .form-card.variable-theme {
      border-top: 3px solid var(--var);
    }

    .section-heading {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    /* 16px obligatorio en iOS para evitar auto-zoom al enfocar */
    .input {
      width: 100%;
      height: 46px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .input:focus {
      border-color: var(--text);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 13px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-submit:active {
      opacity: 0.8;
    }

    .btn-fixed {
      background: var(--fixed);
      color: #fff;
    }

    .btn-variable {
      background: var(--var);
      color: #0b0f19;
    }

    /* Listado de Movimientos */
    .list-header {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .expense-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .expense-row.fixed-row {
      border-left: 4px solid var(--fixed);
    }

    .expense-row.variable-row {
      border-left: 4px solid var(--var);
    }

    .row-main {
      min-width: 0;
      flex: 1;
    }

    .row-title {
      font-size: 0.98rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .row-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .pill-fixed {
      background: var(--fixed-soft);
      color: #a5b4fc;
    }

    .row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .row-amount {
      font-size: 1.02rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-btn {
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-muted);
      cursor: pointer;
    }

    .status-btn.is-paid {
      background: var(--paid-soft);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--paid);
    }

    .del-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: none;
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .empty-msg {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 0.88rem;
      background: var(--surface);
      border-radius: 15px;
      border: 1px dashed var(--border);
    }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 99;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<main class="app">
  <!-- Cabecera -->
  <header class="top-bar">
    <h1 class="app-title">Gastos</h1>
    <div class="month-control">
      <input type="month" id="monthPicker" aria-label="Seleccionar mes" />
      <button class="btn-refresh" id="btnRefresh" title="Actualizar">&#x21bb;</button>
    </div>
  </header>

  <!-- Total General -->
  <section class="hero-total">
    <div>
      <div class="hero-label">Total del mes</div>
      <div class="hero-amount" id="totalMes">0,00 €</div>
    </div>
    <div class="sync-dot" id="syncStatus">Al día</div>
  </section>

  <!-- Tarjetas Diferenciadas por Color -->
  <section class="split-cards">
    <div class="mini-card fixed">
      <div class="mini-title"><span class="dot fixed"></span> Fijos</div>
      <div class="mini-amount" id="totalFijos">0,00 €</div>
      <div class="mini-sub" id="subFijos">Pagado: 0,00 €</div>
    </div>
    <div class="mini-card variable">
      <div class="mini-title"><span class="dot variable"></span> Puntuales</div>
      <div class="mini-amount" id="totalPuntuales">0,00 €</div>
      <div class="mini-sub" id="subPuntuales">0 apuntes</div>
    </div>
  </section>

  <!-- Selector de Sección -->
  <nav class="segmented">
    <button type="button" class="seg-btn active-variable" id="tabPuntuales">Gastos Puntuales</button>
    <button type="button" class="seg-btn" id="tabFijos">Gastos Fijos</button>
  </nav>

  <!-- VISTA 1: GASTOS PUNTUALES (ÁMBAR) -->
  <section id="viewPuntuales">
    <form id="formPuntual" class="form-card variable-theme">
      <div class="section-heading">
        <span class="dot variable"></span> Añadir gasto puntual
      </div>

      <div class="field-group">
        <label class="field-label" for="punConcepto">¿En qué has gastado?</label>
        <input class="input" type="text" id="punConcepto" placeholder="Ej. Mercadona, Café, Farmacia..." required />
      </div>

      <div class="field-row">
        <div>
          <label class="field-label" for="punImporte">Importe (€)</label>
          <input class="input" type="number" inputmode="decimal" step="0.01" min="0.01" id="punImporte" placeholder="0,00" required />
        </div>
        <div>
          <label class="field-label" for="punFecha">Fecha</label>
          <input class="input" type="date" id="punFecha" required />
        </div>
      </div>

      <button type="submit" class="btn-submit btn-variable">Guardar gasto puntual</button>
    </form>

    <div class="list-header">Puntuales este mes</div>
    <div id="listPuntuales" class="item-list"></div>
  </section>

  <!-- VISTA 2: GASTOS FIJOS (ÍNDIGO) -->
  <section id="viewFijos" class="hidden">
    <form id="formFijo" class="form-card fixed-theme">
      <div class="section-heading">
        <span class="dot fixed"></span> Añadir gasto fijo mensual
      </div>

      <div class="field-group">
        <label class="field-label" for="fixConcepto">Concepto del recibo</label>
        <input class="input" type="text" id="fixConcepto" placeholder="Ej. Alquiler piso, Factura luz..." required />
      </div>

      <div class="field-row">
        <div>
          <label class="field-label" for="fixImporte">Importe (€)</label>
          <input class="input" type="number" inputmode="decimal" step="0.01" min="0.01" id="fixImporte" placeholder="0,00" required />
        </div>
        <div>
          <label class="field-label" for="fixCategoria">Categoría</label>
          <select class="input" id="fixCategoria">
            <option value="Alquiler">Alquiler</option>
            <option value="Luz">Luz</option>
            <option value="Internet">Internet</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-submit btn-fixed">Guardar gasto fijo</button>
    </form>

    <div class="list-header">Tus recibos fijos</div>
    <div id="listFijos" class="item-list"></div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzRkndI7vLONGGWdUHKdirdNr48v0eYiFcp6YbHYyZ_pKhpzTLmYtwMgRPH3cDDWdAwSA/exec';

  let state = { fijos: [], puntuales: [] };
  const $ = (id) => document.getElementById(id);

  document.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');

    $('monthPicker').value = `${yyyy}-${mm}`;
    $('punFecha').value = `${yyyy}-${mm}-${dd}`;

    bindEvents();
    loadData();
  });

  function bindEvents() {
    // Cambio de pestañas con cambio de color activo
    $('tabPuntuales').addEventListener('click', () => {
      $('tabPuntuales').className = 'seg-btn active-variable';
      $('tabFijos').className = 'seg-btn';
      $('viewPuntuales').classList.remove('hidden');
      $('viewFijos').classList.add('hidden');
    });

    $('tabFijos').addEventListener('click', () => {
      $('tabFijos').className = 'seg-btn active-fixed';
      $('tabPuntuales').className = 'seg-btn';
      $('viewFijos').classList.remove('hidden');
      $('viewPuntuales').classList.add('hidden');
    });

    $('monthPicker').addEventListener('change', loadData);
    $('btnRefresh').addEventListener('click', loadData);

    // Guardar Gasto Puntual
    $('formPuntual').addEventListener('submit', async (e) => {
      e.preventDefault();
      const concepto = $('punConcepto').value.trim();
      const importe = parseFloat($('punImporte').value);
      const fecha = $('punFecha').value;
      if (!concepto || isNaN(importe) || !fecha) return;

      await postAction({ action: 'addManualExpense', concepto, importe, fecha });
      $('punConcepto').value = '';
      $('punImporte').value = '';
      showToast('Gasto puntual guardado');
      loadData();
    });

    // Guardar Gasto Fijo
    $('formFijo').addEventListener('submit', async (e) => {
      e.preventDefault();
      const concepto = $('fixConcepto').value.trim();
      const importe = parseFloat($('fixImporte').value);
      const categoria = $('fixCategoria').value;
      if (!concepto || isNaN(importe)) return;

      await postAction({ action: 'addFixed', concepto, importe, categoria });
      $('fixConcepto').value = '';
      $('fixImporte').value = '';
      showToast('Gasto fijo guardado');
      loadData();
    });
  }

  async function loadData() {
    setSync('Cargando...');
    try {
      const month = $('monthPicker').value;
      const res = await fetch(`${API_URL}?month=${encodeURIComponent(month)}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Error de lectura');
      state = data;
      renderAll();
      setSync('Al día');
    } catch (err) {
      setSync('Error');
      showToast('Error al cargar datos');
    }
  }

  async function postAction(payload) {
    setSync('Guardando...');
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Error al guardar');
      return data;
    } catch (err) {
      setSync('Error');
      showToast('Error: ' + err.message);
      throw err;
    }
  }

  function renderAll() {
    const totalFijos = state.fijos.reduce((acc, f) => acc + f.importe, 0);
    const pagadoFijos = state.fijos.reduce((acc, f) => acc + (f.pagado ? f.importe : 0), 0);
    const totalPuntuales = state.puntuales.reduce((acc, p) => acc + p.importe, 0);

    $('totalFijos').textContent = formatEuro(totalFijos);
    $('subFijos').textContent = `Pagado: ${formatEuro(pagadoFijos)}`;
    $('totalPuntuales').textContent = formatEuro(totalPuntuales);
    $('subPuntuales').textContent = `${state.puntuales.length} ${state.puntuales.length === 1 ? 'apunte' : 'apuntes'}`;
    $('totalMes').textContent = formatEuro(totalFijos + totalPuntuales);

    renderPuntuales();
    renderFijos();
  }

  function renderPuntuales() {
    const list = $('listPuntuales');
    if (state.puntuales.length === 0) {
      list.innerHTML = '<div class="empty-msg">Sin gastos puntuales en este mes.</div>';
      return;
    }

    list.innerHTML = '';
    state.puntuales.forEach(item => {
      const el = document.createElement('div');
      el.className = 'expense-row variable-row';
      el.innerHTML = `
        <div class="row-main">
          <div class="row-title">${escapeHtml(item.concepto)}</div>
          <div class="row-sub">${formatShortDate(item.fecha)}</div>
        </div>
        <div class="row-right">
          <span class="row-amount">${formatEuro(item.importe)}</span>
          <button type="button" class="del-btn" data-delpun="${item.id}" aria-label="Borrar">✕</button>
        </div>
      `;
      list.appendChild(el);
    });

    list.querySelectorAll('[data-delpun]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('¿Borrar este gasto puntual?')) return;
        await postAction({ action: 'deleteExpense', id: btn.dataset.delpun });
        showToast('Gasto eliminado');
        loadData();
      });
    });
  }

  function renderFijos() {
    const list = $('listFijos');
    if (state.fijos.length === 0) {
      list.innerHTML = '<div class="empty-msg">Añade arriba tus gastos fijos (Alquiler, Luz, Internet).</div>';
      return;
    }

    list.innerHTML = '';
    state.fijos.forEach(item => {
      const el = document.createElement('div');
      el.className = 'expense-row fixed-row';
      el.innerHTML = `
        <div class="row-main">
          <div class="row-title">${escapeHtml(item.concepto)}</div>
          <div class="row-sub">
            <span class="pill pill-fixed">${escapeHtml(item.categoria)}</span>
          </div>
        </div>
        <div class="row-right">
          <span class="row-amount">${formatEuro(item.importe)}</span>
          <button type="button" class="status-btn ${item.pagado ? 'is-paid' : ''}" data-toggle="${item.id}">
            ${item.pagado ? 'Pagado' : 'Pendiente'}
          </button>
          <button type="button" class="del-btn" data-delfix="${item.id}" aria-label="Borrar">✕</button>
        </div>
      `;
      list.appendChild(el);
    });

    list.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.toggle;
        const item = state.fijos.find(x => x.id === id);
        if (!item) return;
        await postAction({
          action: 'toggleFixedPaid',
          id: id,
          pagado: !item.pagado,
          month: $('monthPicker').value
        });
        loadData();
      });
    });

    list.querySelectorAll('[data-delfix]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('¿Eliminar este gasto fijo mensual?')) return;
        await postAction({ action: 'deleteFixed', id: btn.dataset.delfix });
        showToast('Gasto fijo eliminado');
        loadData();
      });
    });
  }

  function formatEuro(num) {
    return Number(num || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  }

  function formatShortDate(iso) {
    const parts = String(iso).split('-');
    if (parts.length !== 3) return iso;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function setSync(text) {
    $('syncStatus').textContent = text;
  }

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.add('hidden'), 2600);
  }
</script>
</body>
</html>
